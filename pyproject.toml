[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ufast"
version = "1.0.0"
description = "U-FAST (Unified Fab-AMHS Simulation Toolkit) — co-simulation of semiconductor fab production and AMHS logistics"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "scipy",            # C Dijkstra acceleration for fast_pathfinder
    "python-dateutil",
    "pytz",
    "six",
    "tzdata",
    "joblib",
    "tqdm",
]

[project.optional-dependencies]
gui = ["PyQt6"]
viz = ["rerun-sdk", "matplotlib", "pyarrow"]  # --viz replay, report and Replay recording

[project.scripts]
ufast-run = "ufast.cosim.run:main"
ufast-fromto = "ufast.cosim.run_fromto:main"
ufast-analyze = "ufast.cosim.analyze:main"
ufast-aggregate = "ufast.cosim.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ufast*"]
